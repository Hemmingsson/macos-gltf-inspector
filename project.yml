name: GLBPreview
options:
  bundleIdPrefix: com.laurie
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources

schemes:
    GLBPreview:
      build:
        targets:
          GLBPreview: all
      run:
        config: Debug
      test:
        config: Debug
        targets:
          - GLBPreviewTests
    GLBPromo:
      build:
        targets:
          GLBPromo: all
      run:
        config: Release

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.15"
  DracoSwift:
    url: https://github.com/warrenm/DracoSwift
    from: "1.5.7"

targets:
  GLBPreview:
    type: application
    platform: macOS
    sources:
      - GLBPreview
      - path: ICON.icon
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
    info:
      path: GLBPreview/Info.plist
      properties:
        CFBundleIconName: ICON
        CFBundleDocumentTypes:
          - CFBundleTypeName: GL Transmission Format Binary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.glb
          - CFBundleTypeName: GL Transmission Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.gltf
          - CFBundleTypeName: glTF sidecar
            CFBundleTypeRole: None
            LSHandlerRank: None
            NSIsRelatedItemType: true
            LSTypeIsPackage: false
            CFBundleTypeExtensions:
              - bin
              - png
              - jpg
              - jpeg
              - webp
              - ktx2
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: GL Transmission Format Binary
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - glb
              public.mime-type:
                - model/gltf-binary
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: GL Transmission Format
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - gltf
              public.mime-type:
                - model/gltf+json
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "4"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 94A9N4B67S
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_TESTABILITY: NO
        SWIFT_OBJC_BRIDGING_HEADER: Shared/GLBPreview-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: ICON
    dependencies:
      - target: PreviewExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - package: GLTFKit2
      - package: DracoSwift

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes:
          - "*.swift"
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: GLB Preview
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview.PreviewExtension
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 94A9N4B67S
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_OBJC_BRIDGING_HEADER: Shared/GLBPreview-Bridging-Header.h
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
        excludes:
          - GLBPreviewView.swift
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: GLB Thumbnail
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview.ThumbnailExtension
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 94A9N4B67S
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_OBJC_BRIDGING_HEADER: Shared/GLBPreview-Bridging-Header.h
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift

  GLBPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GLBPreviewTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreviewTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 94A9N4B67S
        ENABLE_TESTING_SEARCH_PATHS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Shared/GLBPreview-Bridging-Header.h
    dependencies:
      - target: GLBPreview
      - package: GLTFKit2
      - package: DracoSwift

  GLBPromo:
    type: tool
    platform: macOS
    sources:
      - PromoTool
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
        excludes:
          - GLBPreviewView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview.Promo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 94A9N4B67S
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_OBJC_BRIDGING_HEADER: Shared/GLBPreview-Bridging-Header.h
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/Frameworks"
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift
