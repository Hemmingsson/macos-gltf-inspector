name: GLBPreview
options:
  bundleIdPrefix: com.laurie
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources

schemes:
    GLBPreview:
      build:
        targets:
          GLBPreview: all
      run:
        config: Debug
      test:
        config: Debug
        targets:
          - GLBPreviewTests

# Shared across every target so signing and versions live in one place.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 94A9N4B67S
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_OBJC_BRIDGING_HEADER: Shared/GLBPreview-Bridging-Header.h

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.15"
  DracoSwift:
    url: https://github.com/warrenm/DracoSwift
    from: "1.5.7"

targets:
  GLBPreview:
    type: application
    platform: macOS
    sources:
      - GLBPreview
      - path: assets/ICON.icon
        type: file
        buildPhase: resources
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
      - path: Shared/Convert
        includes:
          - "*.swift"
    info:
      path: GLBPreview/Info.plist
      properties:
        CFBundleIconName: ICON
        CFBundleDocumentTypes:
          - CFBundleTypeName: GL Transmission Format Binary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.glb
          - CFBundleTypeName: GL Transmission Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.gltf
          - CFBundleTypeName: glTF sidecar
            CFBundleTypeRole: None
            LSHandlerRank: None
            NSIsRelatedItemType: true
            LSTypeIsPackage: false
            CFBundleTypeExtensions:
              - bin
              - png
              - jpg
              - jpeg
              - webp
              - ktx2
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: GL Transmission Format Binary
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - glb
              public.mime-type:
                - model/gltf-binary
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: GL Transmission Format
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - gltf
              public.mime-type:
                - model/gltf+json
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/Hemmingsson/macos-gltf-preview/releases/latest/download/appcast.xml
        SUPublicEDKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ICON
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ARCHS: arm64 x86_64
          ONLY_ACTIVE_ARCH: NO
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_TESTABILITY: NO
    dependencies:
      - target: PreviewExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - package: Sparkle
        product: Sparkle
      - package: GLTFKit2
      - package: DracoSwift

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes:
          - "*.swift"
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
      - path: Shared/Convert
        includes:
          - "*.swift"
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: GLB Preview
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview.PreviewExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
        excludes:
          - PreviewView.swift
          - PreviewScene.swift
          - PreviewChrome.swift
          - PreviewCycleMenu.swift
          - PreviewOverlayFacts.swift
          - AppSettings.swift
      - path: Shared/Convert
        includes:
          - "*.swift"
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: GLB Thumbnail
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreview.ThumbnailExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift

  GLBPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GLBPreviewTests
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laurie.GLBPreviewTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
    dependencies:
      - target: GLBPreview
      - package: GLTFKit2
      - package: DracoSwift
