name: GLTFInspector
options:
  bundleIdPrefix: lol.mattias
  deploymentTarget:
    macOS: "26.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources

schemes:
    GLTFInspector:
      build:
        targets:
          GLTFInspector: all
      run:
        config: Debug
      test:
        config: Debug
        targets:
          - GLTFInspectorTests

    PreviewUI:
      build:
        targets:
          PreviewUI: all

    DesignCatalog:
      build:
        targets:
          DesignCatalog: all
      run:
        config: Debug

# Shared across every target so signing and versions live in one place.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 94A9N4B67S
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.15"
  DracoSwift:
    url: https://github.com/warrenm/DracoSwift
    from: "1.5.7"

targets:
  # DS tokens + components (Liquid Glass wrappers). Extension-safe: RendererRealityKit's Quick
  # Look chrome links it, so the extensions resolve it from the host's embedded copy.
  DesignSystem:
    type: framework
    platform: macOS
    sources:
      - DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.DesignSystem
        PRODUCT_MODULE_NAME: DesignSystem
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  PreviewUI:
    type: framework
    platform: macOS
    sources:
      - PreviewUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.PreviewUI
        PRODUCT_MODULE_NAME: PreviewUI
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: YES
    dependencies:
      - target: DesignSystem
        embed: false

  # Showcase app for the design system: every token, DS component and PreviewUI composite
  # rendered with real Liquid Glass over light / dark canvas and the checkerboard.
  # `./scripts/dev.sh catalog` builds and launches it in the background.
  DesignCatalog:
    type: application
    platform: macOS
    sources:
      - DesignCatalog
    settings:
      base:
        PRODUCT_NAME: DesignCatalog
        PRODUCT_MODULE_NAME: DesignCatalog
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.design-catalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Design Catalog
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    dependencies:
      - target: DesignSystem
        embed: true
      - target: PreviewUI
        embed: true

  # Renderer-neutral, extension-safe core: glTF file model, validator, stats, App Group
  # settings, bundled Khronos HDRs. Linked by the host (embedded once), both extensions and the
  # tests. Must not import RealityKit, WebKit, AppKit or PreviewUI.
  GLTFCore:
    type: framework
    platform: macOS
    sources:
      - GLTFCore
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Vendor/gltf-validator
        includes:
          - gltf_validator.dart.js
          - LICENSE
          - NOTICES
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.GLTFCore
        PRODUCT_MODULE_NAME: GLTFCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # RealityKit renderer: glTF → GLTFKit2 → prepare → convert → RealityKit entities, the
  # RealityView canvas, look / camera / floor, and offscreen stills. Extension-safe (no NSApp;
  # the host owns the PNG save panel). The only target that links GLTFKit2 and DracoSwift.
  # GLBTry.h is public because framework targets cannot use a bridging header.
  RendererRealityKit:
    type: framework
    platform: macOS
    sources:
      - path: RendererRealityKit
        excludes:
          - GLBDracoDecompressor.h
          - GLBTry.h
          - RendererRealityKit.h
      - path: RendererRealityKit/RendererRealityKit.h
        headerVisibility: public
      - path: RendererRealityKit/GLBTry.h
        headerVisibility: public
      - path: RendererRealityKit/GLBDracoDecompressor.h
        headerVisibility: project
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.RendererRealityKit
        PRODUCT_MODULE_NAME: RendererRealityKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: GLTFCore
        embed: false
      # Quick Look chrome (PreviewQuickLookChrome) uses the DS glass buttons.
      - target: DesignSystem
        embed: false
      - package: GLTFKit2
      - package: DracoSwift

  # WebKit renderer: one WKWebView page (the vendored Khronos glTF Sample Renderer) driven from
  # Swift — host, scheme handler, command bridge, the SwiftUI canvas. Extension-safe. The page
  # ships once, inside this framework; `WebRendererHost` finds it with `Bundle(for:)` (the HDRs
  # come from GLTFCore).
  RendererWebKit:
    type: framework
    platform: macOS
    sources:
      - path: RendererWebKit
        excludes:
          - web-renderer
      - path: RendererWebKit/web-renderer
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.RendererWebKit
        PRODUCT_MODULE_NAME: RendererWebKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: GLTFCore
        embed: false

  GLTFInspector:
    type: application
    platform: macOS
    sources:
      - GLTFInspector
      - path: assets/ICON.icon
        type: file
        buildPhase: resources
    # Not sandboxed. The only entitlement is the App Group, so Settings (group suite + look.json
    # in the group container) is visible to both extensions.
    entitlements:
      path: GLTFInspector/GLTFInspector.entitlements
      properties:
        com.apple.security.application-groups:
          - 94A9N4B67S.lol.mattias.gltf-inspector
    info:
      path: GLTFInspector/Info.plist
      properties:
        CFBundleIconName: ICON
        CFBundleDisplayName: glTF Inspector
        CFBundleDocumentTypes:
          - CFBundleTypeName: GL Transmission Format Binary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.glb
          - CFBundleTypeName: GL Transmission Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.gltf
          - CFBundleTypeName: glTF sidecar
            CFBundleTypeRole: None
            LSHandlerRank: None
            NSIsRelatedItemType: true
            LSTypeIsPackage: false
            CFBundleTypeExtensions:
              - bin
              - png
              - jpg
              - jpeg
              - webp
              - ktx2
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: GL Transmission Format Binary
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - glb
              public.mime-type:
                - model/gltf-binary
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: GL Transmission Format
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - gltf
              public.mime-type:
                - model/gltf+json
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/Hemmingsson/macos-gltf-inspector/releases/latest/download/appcast.xml
        SUPublicEDKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_NAME: glTF Inspector
        PRODUCT_MODULE_NAME: GLTFInspector
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ICON
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - target: DesignSystem
        embed: true
      - target: GLTFCore
        embed: true
      - target: RendererRealityKit
        embed: true
      - target: RendererWebKit
        embed: true
      - target: PreviewUI
        embed: true
      - target: PreviewExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - package: Sparkle
        product: Sparkle
      # RendererRealityKit is the only code that uses GLTFKit2 (a dynamic framework). A framework
      # target does not embed package products, so the host carries it once for the framework and
      # both extensions to resolve through @rpath.
      - package: GLTFKit2

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Settings live in the App Group shared with the host (GLTFCore/AppGroupSettings.swift).
        com.apple.security.application-groups:
          - 94A9N4B67S.lol.mattias.gltf-inspector
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        # glTF assets reference sibling files (.bin buffers, textures) that can sit anywhere the
        # user opens from, so the sandboxed extensions need read access beyond the opened file.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
        # WKWebView spawns a Networking XPC service even with no network use; without this the
        # extension is denied the mach extension WebContent needs and WebContent dies on launch.
        com.apple.security.network.client: true
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: glTF Inspector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.PreviewExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - target: GLTFCore
        embed: false
      - target: RendererRealityKit
        embed: false
      - target: RendererWebKit
        embed: false

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Settings live in the App Group shared with the host (GLTFCore/AppGroupSettings.swift).
        com.apple.security.application-groups:
          - 94A9N4B67S.lol.mattias.gltf-inspector
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        # glTF assets reference sibling files (.bin buffers, textures) that can sit anywhere the
        # user opens from, so the sandboxed extensions need read access beyond the opened file.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
        # SPIKE: WKWebView spawns Networking/GPU XPC services even with no network use.
        com.apple.security.network.client: true
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: glTF Inspector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.ThumbnailExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - target: GLTFCore
        embed: false
      - target: RendererRealityKit
        embed: false
      - target: RendererWebKit
        embed: false

  GLTFInspectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GLTFInspectorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/glTF Inspector.app/Contents/MacOS/glTF Inspector"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: GLTFInspector
      - target: GLTFCore
        embed: false
      - target: RendererRealityKit
        embed: false
      - target: RendererWebKit
        embed: false
      - target: DesignSystem
        embed: false
      - target: PreviewUI
        embed: false
