name: GLTFInspector
options:
  bundleIdPrefix: lol.mattias
  deploymentTarget:
    macOS: "26.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources

schemes:
    GLTFInspector:
      build:
        targets:
          GLTFInspector: all
      run:
        config: Debug
      test:
        config: Debug
        targets:
          - GLTFInspectorTests

# Shared across every target so signing and versions live in one place.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 94A9N4B67S
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_OBJC_BRIDGING_HEADER: Shared/GLTFInspector-Bridging-Header.h

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.15"
  DracoSwift:
    url: https://github.com/warrenm/DracoSwift
    from: "1.5.7"

targets:
  GLTFInspector:
    type: application
    platform: macOS
    sources:
      - GLTFInspector
      - PreviewUI
      - path: assets/ICON.icon
        type: file
        buildPhase: resources
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
      - path: Shared/Convert
        includes:
          - "*.swift"
      - path: Vendor/gltf-validator
        includes:
          - gltf_validator.dart.js
          - LICENSE
          - NOTICES
        buildPhase: resources
    info:
      path: GLTFInspector/Info.plist
      properties:
        CFBundleIconName: ICON
        CFBundleDisplayName: glTF Inspector
        CFBundleDocumentTypes:
          - CFBundleTypeName: GL Transmission Format Binary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.glb
          - CFBundleTypeName: GL Transmission Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.gltf
          - CFBundleTypeName: glTF sidecar
            CFBundleTypeRole: None
            LSHandlerRank: None
            NSIsRelatedItemType: true
            LSTypeIsPackage: false
            CFBundleTypeExtensions:
              - bin
              - png
              - jpg
              - jpeg
              - webp
              - ktx2
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: GL Transmission Format Binary
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - glb
              public.mime-type:
                - model/gltf-binary
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: GL Transmission Format
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - gltf
              public.mime-type:
                - model/gltf+json
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/Hemmingsson/macos-gltf-inspector/releases/latest/download/appcast.xml
        SUPublicEDKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_NAME: glTF Inspector
        PRODUCT_MODULE_NAME: GLTFInspector
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ICON
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ARCHS: arm64 x86_64
          ONLY_ACTIVE_ARCH: NO
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_TESTABILITY: NO
    dependencies:
      - target: PreviewExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - package: Sparkle
        product: Sparkle
      - package: GLTFKit2
      - package: DracoSwift

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
        includes:
          - "*.swift"
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
        excludes:
          - GLTFValidator.swift
          - PreviewFocus.swift
          - PreviewMorph.swift
          - SelectionDetail.swift
          - ModelDimensions.swift
      - path: Shared/Convert
        includes:
          - "*.swift"
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        # glTF assets reference sibling files (.bin buffers, textures) that can sit anywhere the
        # user opens from, so the sandboxed extensions need read access beyond the opened file.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: glTF Inspector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.PreviewExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Shared
        includes:
          - "*.swift"
          - GLBDracoDecompressor.mm
          - GLBTry.mm
        excludes:
          - PreviewView.swift
          - PreviewScene.swift
          - PreviewChrome.swift
          - PreviewQuickLookChrome.swift
          - PreviewOverlayFacts.swift
          - PreviewFloor.swift
          - AppSettings.swift
          - GLTFValidator.swift
          - PreviewFocus.swift
          - PreviewMorph.swift
          - SelectionDetail.swift
          - PreviewSessionBindings.swift
          - PreviewSkeletonOverlay.swift
          - ModelDimensions.swift
      - path: Shared/Convert
        includes:
          - "*.swift"
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        # glTF assets reference sibling files (.bin buffers, textures) that can sit anywhere the
        # user opens from, so the sandboxed extensions need read access beyond the opened file.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: glTF Inspector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.ThumbnailExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: GLTFKit2
      - package: DracoSwift

  GLTFInspectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GLTFInspectorTests
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/glTF Inspector.app/Contents/MacOS/glTF Inspector"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: GLTFInspector
      - package: GLTFKit2
      - package: DracoSwift
