name: GLTFInspector
options:
  bundleIdPrefix: lol.mattias
  deploymentTarget:
    macOS: "26.0"
  fileTypes:
    icon:
      file: true
      buildPhase: resources

schemes:
    GLTFInspector:
      build:
        targets:
          GLTFInspector: all
      run:
      test:
        targets:
          - GLTFInspectorTests
        # The WebKit suites drive the page directly; FilamentRendererTests builds its own host.
        environmentVariables:
          GLTF_RENDERER: webkit

    # Opt-in real-window XCUITest flows (`./scripts/dev.sh uitest`); not part of `dev.sh test`.
    GLTFInspectorUITests:
      build:
        targets:
          GLTFInspector: all
          GLTFInspectorUITests: [test]
      test:
        targets:
          - GLTFInspectorUITests

    PreviewUI:
      build:
        targets:
          PreviewUI: all

    DesignCatalog:
      build:
        targets:
          DesignCatalog: all
      run:

# Shared across every target so signing and versions live in one place.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 94A9N4B67S
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    # Filament's prebuilt SDK (.build/filament, scripts/fetch-filament.sh) is arm64 only.
    ARCHS: arm64

packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    exactVersion: "0.5.15"
  DracoSwift:
    url: https://github.com/warrenm/DracoSwift
    exactVersion: "1.5.7"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"

targets:
  # DS tokens + components (Liquid Glass wrappers).
  DesignSystem:
    type: framework
    platform: macOS
    sources:
      - DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.DesignSystem
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  PreviewUI:
    type: framework
    platform: macOS
    sources:
      - PreviewUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.PreviewUI
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: YES
    dependencies:
      - target: DesignSystem
        embed: false

  # Showcase app for the design system: every token, DS component and PreviewUI composite
  # rendered with real Liquid Glass over light / dark canvas and the checkerboard.
  # `./scripts/dev.sh catalog` builds and launches it in the background.
  DesignCatalog:
    type: application
    platform: macOS
    sources:
      - DesignCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.design-catalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Design Catalog
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    dependencies:
      - target: DesignSystem
        embed: true
      - target: PreviewUI
        embed: true

  # Extension-safe core: glTF file model, validator, stats, App Group settings, the bundled
  # Khronos HDRs the page lights with. Linked by the host (embedded once), both extensions and the
  # tests. Must not import WebKit, AppKit or PreviewUI.
  GLTFCore:
    type: framework
    platform: macOS
    sources:
      - GLTFCore
      - path: assets/ibl/khronos
        type: file
        buildPhase: resources
      - path: Vendor/gltf-validator
        includes:
          - gltf_validator.dart.js
          - LICENSE
          - NOTICES
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.GLTFCore
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  RendererMetal:
    type: framework
    platform: macOS
    sources:
      # Per-vertex/per-texel load loops stay optimised in Debug too (bench and tests); plain C, so
      # -O2 changes speed only, not results.
      - path: Vendor/mikktspace
        includes: [mikktspace.c, mikktspace.h]
        headerVisibility: private
        compilerFlags: [-O2]
      - path: Vendor/meshoptimizer
        includes: [meshoptimizer.h, vertexcodec.cpp, indexcodec.cpp, vertexfilter.cpp]
        headerVisibility: private
      - path: RendererMetal
        excludes:
          - Shaders/UPSTREAM.md
          - Shaders/LICENSE
          - Scene/MetalLoadKernels.c
        headerVisibility: public
      - path: RendererMetal/Scene/MetalLoadKernels.c
        compilerFlags: [-O2]
    settings:
      base:
        MTL_FAST_MATH: NO
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.RendererMetal
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/libktx/include
    dependencies:
      - target: GLTFCore
        embed: false
      - package: GLTFKit2
        product: GLTFKit2
      - package: DracoSwift
        product: DracoSwift

  # Objective-C++ over Google's Filament (Metal backend, gltfio ubershaders). Static Filament
  # libraries from the prebuilt SDK in .build/filament (scripts/fetch-filament.sh). Public
  # surface: FLRenderer.h, no Filament headers.
  FilamentBridge:
    type: framework
    platform: macOS
    sources:
      - path: FilamentBridge
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.FilamentBridge
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/.build/filament/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/.build/filament/lib/arm64
        OTHER_LDFLAGS:
          - -lfilament
          - -lbackend
          - -lbluegl
          - -lbluevk
          - -lfilabridge
          - -lfilaflat
          - -lutils
          - -lgeometry
          - -lsmol-v
          - -libl
          - -libl-lite
          - -lgltfio_core
          - -luberarchive
          - -ldracodec
          - -lktxreader
          - -lbasis_transcoder
          - -lstb
          - -lmeshoptimizer
          - -lmikktspace
          - -lzstd
          - -luberzlib
          - -limage
          - -limageio-lite
          - -lfilament-iblprefilter
          - -lfilament-generatePrefilterMipmap
          - -labseil
          - -lperfetto
          - -lshaders
          - -lcamutils
          - -lfilameshio
          - -lfilamat
          - -lmatp
          - -lc++
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - CoreVideo
          - -framework
          - ImageIO
          - -framework
          - AppKit

  # The renderer: one WKWebView page (the vendored Khronos glTF Sample Renderer) driven from
  # Swift — host, scheme handler, command bridge, the SwiftUI canvas. Extension-safe. The page
  # ships once, inside this framework; `WebRendererHost` finds it with `Bundle(for:)` (the HDRs
  # come from GLTFCore).
  RendererWebKit:
    type: framework
    platform: macOS
    sources:
      - path: RendererWebKit
        excludes:
          - web-renderer
      - path: RendererWebKit/web-renderer
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.RendererWebKit
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: GLTFCore
        embed: false
      - target: RendererMetal
        embed: false
      - target: FilamentBridge
        embed: false

  GLTFInspector:
    type: application
    platform: macOS
    sources:
      - GLTFInspector
      # The catalog's pages, opened from the Window menu. The catalog app keeps its own @main.
      - path: DesignCatalog
        excludes:
          - App/DesignCatalogApp.swift
      - path: assets/ICON.icon
        type: file
        buildPhase: resources
    # Not sandboxed. The only entitlement is the App Group, so Settings (the group suite) and the
    # cached posters (the group container) are visible to both extensions.
    entitlements:
      path: GLTFInspector/GLTFInspector.entitlements
      properties:
        com.apple.security.application-groups:
          - 94A9N4B67S.lol.mattias.gltf-inspector
    info:
      path: GLTFInspector/Info.plist
      properties:
        CFBundleIconName: ICON
        CFBundleDisplayName: glTF Inspector
        CFBundleDocumentTypes:
          - CFBundleTypeName: GL Transmission Format Binary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.glb
          - CFBundleTypeName: GL Transmission Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.khronos.gltf
          - CFBundleTypeName: glTF sidecar
            CFBundleTypeRole: None
            LSHandlerRank: None
            NSIsRelatedItemType: true
            LSTypeIsPackage: false
            CFBundleTypeExtensions:
              - bin
              - png
              - jpg
              - jpeg
              - webp
              - ktx2
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.glb
            UTTypeDescription: GL Transmission Format Binary
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - glb
              public.mime-type:
                - model/gltf-binary
          - UTTypeIdentifier: org.khronos.gltf
            UTTypeDescription: GL Transmission Format
            UTTypeConformsTo:
              - public.data
              - public.3d-content
            UTTypeTagSpecification:
              public.filename-extension:
                - gltf
              public.mime-type:
                - model/gltf+json
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/Hemmingsson/macos-gltf-inspector/releases/latest/download/appcast.xml
        SUPublicEDKey: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_NAME: glTF Inspector
        PRODUCT_MODULE_NAME: GLTFInspector
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ICON
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - package: GLTFKit2
      - target: DesignSystem
        embed: true
      - target: GLTFCore
        embed: true
      - target: RendererWebKit
        embed: true
      - target: RendererMetal
        embed: true
      - target: FilamentBridge
        embed: true
      - target: PreviewUI
        embed: true
      - target: PreviewExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - package: Sparkle
        product: Sparkle

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Settings live in the App Group shared with the host (GLTFCore/AppGroupSettings.swift).
        com.apple.security.application-groups:
          - 94A9N4B67S.lol.mattias.gltf-inspector
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        # glTF assets reference sibling files (.bin buffers, textures) that can sit anywhere the
        # user opens from, so the sandboxed extensions need read access beyond the opened file.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
        # WKWebView spawns a Networking XPC service even with no network use; without this the
        # extension is denied the mach extension WebContent needs and WebContent dies on launch.
        com.apple.security.network.client: true
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: glTF Inspector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.PreviewExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - target: GLTFCore
        embed: false
      - target: RendererWebKit
        embed: false

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Settings live in the App Group shared with the host (GLTFCore/AppGroupSettings.swift).
        com.apple.security.application-groups:
          - 94A9N4B67S.lol.mattias.gltf-inspector
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.downloads.read-only: true
        # glTF assets reference sibling files (.bin buffers, textures) that can sit anywhere the
        # user opens from, so the sandboxed extensions need read access beyond the opened file.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /
        # WKWebView spawns a Networking XPC service even with no network use; without this the
        # extension is denied the mach extension WebContent needs and WebContent dies on launch.
        com.apple.security.network.client: true
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: glTF Inspector
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.glb
              - org.khronos.gltf
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.ThumbnailExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - target: GLTFCore
        embed: false
      - target: RendererWebKit
        embed: false

  GLTFInspectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GLTFInspectorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/glTF Inspector.app/Contents/MacOS/glTF Inspector"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: GLTFInspector
      - target: GLTFCore
        embed: false
      - target: RendererMetal
        embed: false
      - target: RendererWebKit
        embed: false
      - target: DesignSystem
        embed: false
      - target: PreviewUI
        embed: false

  # Real-window flows over accessibility only (open, view modes, outliner → inspector,
  # launch / open-to-content metrics). Imports no app module.
  GLTFInspectorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - GLTFInspectorUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.mattias.gltf-inspector.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GLTFInspector
