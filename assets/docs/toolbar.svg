<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Toolbar controls</title><desc id="desc">Wireframe of the glTF Inspector toolbar clusters and their controls.</desc><style>
:root{color-scheme:light dark}text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}.page{fill:#fff}.title{font-size:28px;font-weight:600;fill:#050505}.subtitle,.small,.note{font-size:14px;fill:#626262}.heading{font-size:17px;font-weight:600;fill:#050505}.body{font-size:15px;fill:#050505}.bodyStrong{font-size:15px;font-weight:600;fill:#050505}.panel{fill:#f3f3f3;stroke:#bebebe;stroke-width:1}.separator,.line{stroke:#bebebe;stroke-width:1}.control{fill:#e8e8e8;stroke:#bebebe;stroke-width:1}.controlText{font-size:13px;font-weight:500;fill:#050505}.shortcut{fill:#e8e8e8;stroke:#bebebe;stroke-width:1}.badge{fill:#050505}.badgeText{font-size:13px;font-weight:700;fill:#fff}svg{shape-rendering:geometricPrecision}
@media(prefers-color-scheme:dark){.page{fill:#1c1c1e}.title,.heading,.body,.bodyStrong,.controlText{fill:#f5f5f7}.subtitle,.small,.note{fill:#b5b5ba}.panel{fill:#2c2c2e;stroke:#636366}.separator,.line{stroke:#636366}.control,.shortcut{fill:#3a3a3c;stroke:#636366}.badge{fill:#f5f5f7}.badgeText{fill:#1c1c1e}}
</style><rect width="1240" height="650" class="page"/><text x="52" y="42" class="title" text-anchor="start">Toolbar controls</text><text x="52" y="70" class="subtitle" text-anchor="start">The toolbar keeps related controls in four named clusters.</text><text x="52" y="94" class="subtitle" text-anchor="start">Labels match the live app. Shortcuts appear only when the app binds them.</text><rect x="52" y="108" width="280" height="172" rx="16" class="panel"/><text x="70" y="136" class="heading" text-anchor="start">Stage</text><text x="70" y="156" class="small" text-anchor="start">Set the backdrop and floor.</text><line x1="70" y1="168" x2="314" y2="168" class="separator"/><rect x="70" y="176" width="112" height="20" rx="10" class="control"/><text x="126" y="190" class="controlText" text-anchor="middle">Backdrop</text><text x="194" y="190" class="small" text-anchor="start">None · White · Dark</text><rect x="70" y="198" width="112" height="20" rx="10" class="control"/><text x="126" y="212" class="controlText" text-anchor="middle">Floor</text><text x="194" y="212" class="small" text-anchor="start">Show or hide</text><circle cx="304" cy="130" r="14" class="badge"/><text x="304" y="135" class="badgeText" text-anchor="middle">1</text><rect x="356" y="108" width="270" height="172" rx="16" class="panel"/><text x="374" y="136" class="heading" text-anchor="start">Look</text><text x="374" y="156" class="small" text-anchor="start">Set the view mode and lighting.</text><line x1="374" y1="168" x2="608" y2="168" class="separator"/><rect x="374" y="176" width="112" height="20" rx="10" class="control"/><text x="430" y="190" class="controlText" text-anchor="middle">View mode</text><text x="498" y="190" class="small" text-anchor="start">Shaded · channels</text><rect x="374" y="198" width="112" height="20" rx="10" class="control"/><text x="430" y="212" class="controlText" text-anchor="middle">Lighting</text><text x="498" y="212" class="small" text-anchor="start">Exposure · look</text><circle cx="598" cy="130" r="14" class="badge"/><text x="598" y="135" class="badgeText" text-anchor="middle">2</text><rect x="650" y="108" width="320" height="172" rx="16" class="panel"/><text x="668" y="136" class="heading" text-anchor="start">Camera</text><text x="668" y="156" class="small" text-anchor="start">Set the projection, lens, and camera.</text><line x1="668" y1="168" x2="952" y2="168" class="separator"/><rect x="668" y="176" width="112" height="20" rx="10" class="control"/><text x="724" y="190" class="controlText" text-anchor="middle">Perspective</text><text x="792" y="190" class="small" text-anchor="start">or Orthographic</text><rect x="668" y="198" width="112" height="20" rx="10" class="control"/><text x="724" y="212" class="controlText" text-anchor="middle">Field of view</text><text x="792" y="212" class="small" text-anchor="start">15°–160°</text><rect x="668" y="220" width="112" height="20" rx="10" class="control"/><text x="724" y="234" class="controlText" text-anchor="middle">View</text><text x="792" y="234" class="small" text-anchor="start">Zoom · Fit · presets</text><circle cx="942" cy="130" r="14" class="badge"/><text x="942" y="135" class="badgeText" text-anchor="middle">3</text><rect x="994" y="108" width="196" height="172" rx="16" class="panel"/><text x="1012" y="136" class="heading" text-anchor="start">Open in</text><text x="1012" y="156" class="small" text-anchor="start">Open related actions.</text><line x1="1012" y1="168" x2="1172" y2="168" class="separator"/><rect x="1012" y="176" width="112" height="20" rx="10" class="control"/><text x="1068" y="190" class="controlText" text-anchor="middle">Open in</text><text x="1136" y="190" class="small" text-anchor="start"></text><circle cx="1162" cy="130" r="14" class="badge"/><text x="1162" y="135" class="badgeText" text-anchor="middle">4</text><text x="52" y="342" class="heading" text-anchor="start">Toolbar anatomy</text><circle cx="66" cy="375" r="14" class="badge"/><text x="66" y="380" class="badgeText" text-anchor="middle">1</text><text x="92" y="380" class="bodyStrong" text-anchor="start">Stage</text><text x="222" y="380" class="body" text-anchor="start">Backdrop and Floor</text><circle cx="66" cy="411" r="14" class="badge"/><text x="66" y="416" class="badgeText" text-anchor="middle">2</text><text x="92" y="416" class="bodyStrong" text-anchor="start">Look</text><text x="222" y="416" class="body" text-anchor="start">View mode and Lighting</text><circle cx="66" cy="447" r="14" class="badge"/><text x="66" y="452" class="badgeText" text-anchor="middle">3</text><text x="92" y="452" class="bodyStrong" text-anchor="start">Camera</text><text x="222" y="452" class="body" text-anchor="start">Perspective, Field of view, and View</text><circle cx="66" cy="483" r="14" class="badge"/><text x="66" y="488" class="badgeText" text-anchor="middle">4</text><text x="92" y="488" class="bodyStrong" text-anchor="start">Open in</text><text x="222" y="488" class="body" text-anchor="start">Finder, Blender, exports, and Copy GLB</text><text x="620" y="342" class="heading" text-anchor="start">Keyboard shortcuts</text><rect x="620" y="361" width="232" height="24" rx="6" class="shortcut"/><text x="632" y="378" class="body" text-anchor="start">⌘1–⌘5 · view modes</text><rect x="620" y="397" width="232" height="24" rx="6" class="shortcut"/><text x="632" y="414" class="body" text-anchor="start">⌘+ / ⌘− · zoom</text><rect x="620" y="433" width="232" height="24" rx="6" class="shortcut"/><text x="632" y="450" class="body" text-anchor="start">⌘9 · Fit</text><rect x="620" y="469" width="232" height="24" rx="6" class="shortcut"/><text x="632" y="486" class="body" text-anchor="start">⌥⌘F · Frame Selection</text><rect x="885" y="361" width="232" height="24" rx="6" class="shortcut"/><text x="897" y="378" class="body" text-anchor="start">⌘0 · Reset View</text><rect x="885" y="397" width="232" height="24" rx="6" class="shortcut"/><text x="897" y="414" class="body" text-anchor="start">⌘R · Auto-Rotate</text><rect x="885" y="433" width="232" height="24" rx="6" class="shortcut"/><text x="897" y="450" class="body" text-anchor="start">⌥⌘5 · Orthographic</text><text x="52" y="604" class="note" text-anchor="start">Open the View menu for camera presets, selection framing, visibility, and reset actions.</text><text x="52" y="630" class="note" text-anchor="start">Open the Lighting popover for Exposure, Environment, and Tone mapping.</text></svg>
