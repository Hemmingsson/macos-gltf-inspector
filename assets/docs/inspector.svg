<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="940" viewBox="0 0 1180 940" role="img" aria-labelledby="title desc"><title id="title">Inspector sections</title><desc id="desc">Wireframe of the glTF Inspector outliner and selection-driven inspector sections.</desc><style>
