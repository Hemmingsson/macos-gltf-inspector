<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">Export results</title><desc id="desc">Wireframe of PNG and turntable export choices and resulting files.</desc><style>
:root{color-scheme:light dark}svg{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:#fff}.page{fill:#fff}.title{font-size:28px;font-weight:600;fill:#050505}.subtitle,.small,.note,.tiny{font-size:14px;fill:#626262}.tiny{font-size:11px}.heading{font-size:17px;font-weight:600;fill:#050505}.body{font-size:15px;fill:#050505}.bodyStrong{font-size:13px;font-weight:600;fill:#050505}.menu,.panel{fill:#f3f3f3;stroke:#bebebe;stroke-width:1}.field,.file{fill:#e8e8e8;stroke:#bebebe;stroke-width:1}.selected{fill:#0a84ff;fill-opacity:.16}.primary{fill:#0a84ff}.primaryText{font-size:14px;font-weight:600;fill:#fff}.line{stroke:#bebebe;stroke-width:1}.arrow{stroke:#050505;stroke-width:1.5}.arrowHead{fill:none;stroke:#050505;stroke-width:1.5}.badge{fill:#050505}.badgeText{font-size:13px;font-weight:700;fill:#fff}
@media(prefers-color-scheme:dark){svg{background:#1c1c1e}.page{fill:#1c1c1e}.title,.heading,.body,.bodyStrong{fill:#f5f5f7}.subtitle,.small,.note,.tiny{fill:#b5b5ba}.menu,.panel{fill:#2c2c2e;stroke:#636366}.field,.file{fill:#3a3a3c;stroke:#636366}.line{stroke:#636366}.arrow,.arrowHead{stroke:#f5f5f7}.badge{fill:#f5f5f7}.badgeText{fill:#1c1c1e}}
</style><rect width="1120" height="520" class="page"/><text x="48" y="46" class="title" text-anchor="start">Export results</text><text x="48" y="74" class="subtitle" text-anchor="start">Choose an export action, then choose a destination in the save panel.</text><rect x="48" y="116" width="286" height="286" rx="14" class="menu"/><text x="72" y="152" class="heading" text-anchor="start">File menu</text><line x1="72" y1="170" x2="310" y2="170" class="line"/><rect x="68" y="188" width="246" height="40" rx="7" class="selected"/><text x="84" y="212" class="body" text-anchor="start">Export PNG…</text><text x="292" y="212" class="small" text-anchor="end">⌘E</text><text x="84" y="270" class="body" text-anchor="start">Export Turntable Video…</text><text x="292" y="270" class="small" text-anchor="end">—</text><text x="84" y="328" class="body" text-anchor="start">Export Turntable GIF…</text><text x="292" y="328" class="small" text-anchor="end">—</text><circle cx="38" cy="116" r="14" class="badge"/><text x="38" y="121" class="badgeText" text-anchor="middle">1</text><line x1="334" y1="260" x2="438" y2="260" class="arrow"/><path d="M430 252 L444 260 L430 268" class="arrowHead"/><circle cx="392" cy="242" r="14" class="badge"/><text x="392" y="247" class="badgeText" text-anchor="middle">2</text><rect x="458" y="116" width="280" height="286" rx="14" class="panel"/><text x="482" y="152" class="heading" text-anchor="start">Save panel</text><text x="482" y="184" class="small" text-anchor="start">Name</text><rect x="482" y="194" width="232" height="30" rx="6" class="field"/><text x="494" y="214" class="body" text-anchor="start">BoomBox.png</text><text x="482" y="258" class="small" text-anchor="start">Format</text><rect x="482" y="268" width="232" height="30" rx="6" class="field"/><text x="494" y="288" class="body" text-anchor="start">PNG</text><rect x="602" y="342" width="112" height="34" rx="17" class="primary"/><text x="658" y="364" class="primaryText" text-anchor="middle">Export</text><circle cx="448" cy="104" r="14" class="badge"/><text x="448" y="109" class="badgeText" text-anchor="middle">3</text><line x1="738" y1="260" x2="842" y2="260" class="arrow"/><path d="M834 252 L848 260 L834 268" class="arrowHead"/><circle cx="796" cy="242" r="14" class="badge"/><text x="796" y="247" class="badgeText" text-anchor="middle">4</text><rect x="858" y="116" width="214" height="286" rx="14" class="panel"/><text x="882" y="152" class="heading" text-anchor="start">File result</text><rect x="882" y="178" width="166" height="42" rx="7" class="file"/><text x="894" y="196" class="bodyStrong" text-anchor="start">BoomBox.png</text><text x="894" y="212" class="tiny" text-anchor="start">Canvas at the current camera pose</text><rect x="882" y="242" width="166" height="42" rx="7" class="file"/><text x="894" y="260" class="bodyStrong" text-anchor="start">BoomBox turntable.mp4</text><text x="894" y="276" class="tiny" text-anchor="start">One 360° orbit · H.264 · 30 fps</text><rect x="882" y="306" width="166" height="42" rx="7" class="file"/><text x="894" y="324" class="bodyStrong" text-anchor="start">BoomBox turntable.gif</text><text x="894" y="340" class="tiny" text-anchor="start">One 360° orbit · looping GIF · 15 fps</text><circle cx="848" cy="104" r="14" class="badge"/><text x="848" y="109" class="badgeText" text-anchor="middle">5</text><text x="48" y="456" class="note" text-anchor="start">PNG uses the current canvas pose. Turntable exports orbit the model once from that pose.</text><text x="48" y="480" class="note" text-anchor="start">MP4 uses a 1080-pixel long edge. GIF uses a 540-pixel long edge.</text></svg>
