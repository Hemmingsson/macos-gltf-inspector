<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#24272b;width:1920px;height:1080px;overflow:hidden}#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 18% 95%,#f99e91,transparent 55%),radial-gradient(ellipse at 85% 8%,#b8d4e5,transparent 60%),linear-gradient(135deg,#6c6f9d,#d8c1cc 55%,#657da6)}
.caption{position:absolute;top:75px;left:150px}.caption small{font-size:21px;letter-spacing:3px;text-transform:uppercase;opacity:.6}.caption h1{font-size:58px;letter-spacing:-2px;margin:13px 0}.caption p{font-size:25px;margin:0;color:#424850}.window{position:absolute;left:150px;top:275px;width:1620px;height:705px;border-radius:20px;background:#f3f3f4;border:1px solid #ffffffa0;box-shadow:0 45px 100px #23304f50,0 5px 15px #23304f30;overflow:hidden}.bar{height:67px;background:#e7e7ebdd;display:flex;align-items:center;padding:0 24px;gap:11px;border-bottom:1px solid #0001}.dot{width:16px;height:16px;border-radius:50%;background:#ff6058}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}.title{font-size:22px;font-weight:600;margin-left:32px}.tools{margin-left:auto;font-size:22px;color:#5c616b}.body{height:calc(100% - 67px);display:flex}.side{width:255px;background:#e8e8edbb;padding:30px 20px;font-size:20px;line-height:2.4}.side b{display:block;font-size:16px;color:#777b85}.selected{background:#d0dce9;border-radius:8px;padding:0 12px}.canvas{position:relative;flex:1;min-width:0;background:#fafafa}.canvas img{width:100%;height:100%;object-fit:contain}.inspector{width:285px;padding:28px;background:#f4f4f6;border-left:1px solid #0001;font-size:19px;line-height:2}.inspector b{font-size:22px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #0001;padding:12px 0}.files{display:none;flex:1;align-items:center;justify-content:center;gap:32px;background:white}.file{width:175px;text-align:center;font-size:18px}.file img{width:175px;height:175px;object-fit:contain}.preview .files,.thumbnails .files{display:flex}.preview .canvas{flex:none;width:640px}.preview .inspector,.quicklook .side,.quicklook .inspector,.thumbnails .canvas,.thumbnails .inspector{display:none}.quicklook{left:420px;width:1080px}.badge{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:15px;color:#6d7280;background:#ffffffb0;padding:8px 18px;border-radius:20px}.progress{position:absolute;bottom:0;left:0;height:4px;background:#475b77}.cursor{position:absolute;left:1140px;top:640px;width:30px;height:40px;filter:drop-shadow(0 2px 2px #0006)}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">
<div class="caption"><small>glTF Inspector · macOS</small><h1 id="headline"></h1><p id="description"></p></div>
<div class="window" id="window"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="title" id="title">BoomBox.glb</span><span class="tools" id="tools">glTF Inspector</span></div><div class="body"><aside class="side" id="sidebar"></aside><div class="files" id="files"></div><div class="canvas"><img id="model" alt="Real Metal-rendered model"><div class="badge" id="badge"></div></div><aside class="inspector"><b>Scene</b><div class="row"><span>View</span><span>Shaded</span></div><div class="row"><span>Camera</span><span>Perspective</span></div><div class="row"><span>Lighting</span><span>Neutral</span></div><br><b>Inspect your glTF</b><p>Scenes, materials,<br>textures & animations.</p></aside></div></div>
<svg class="cursor" id="cursor" viewBox="0 0 30 40"><path d="M2 2L3 32L11 25L17 38L23 35L17 22L28 21Z" fill="white" stroke="#222" stroke-width="2"/></svg><div class="progress" id="progress"></div></div>
<script>
const ONLY_SHOT = null;
const shots=['app','quicklook','preview','thumbnails'];
const copy={app:['Meet your glTF.','Open, orbit, and inspect — with native Metal rendering.'],quicklook:['A closer look. One space bar.','Preview glTF files directly in Finder with Quick Look.'],preview:['Keep browsing. Keep looking.','Your models, right in the Finder preview pane.'],thumbnails:['Recognize it before you open it.','Real model thumbnails throughout Finder.']};
let manifest={};const cache=new Map();
function src(shot,i){return `assets/${shot}/${String(i).padStart(4,'0')}.png`}
function renderAt(t){const shot=ONLY_SHOT||shots[Math.min(3,Math.floor(t/4))];const local=ONLY_SHOT?t:t%4;const i=Math.floor(local/4*120)%120;document.getElementById('model').src=src(shot,i);document.getElementById('window').className='window '+shot;document.getElementById('headline').textContent=copy[shot][0];document.getElementById('description').textContent=copy[shot][1];document.getElementById('title').textContent=shot==='preview'||shot==='thumbnails'?'Models':manifest[shot]?.name||'Model.glb';document.getElementById('tools').textContent=shot==='quicklook'?'Open with glTF Inspector':shot==='app'?'glTF Inspector':'Finder';document.getElementById('sidebar').innerHTML=shot==='app'?'<b>SCENE</b><div class="selected">Scene</div>　 Mesh<br><br><b>ASSETS</b>Materials<br>Textures<br>Animations':'<b>FAVORITES</b>AirDrop<br>Recents<br>Applications<br>Desktop<br><div class="selected">Models</div>';document.getElementById('badge').textContent=shot==='quicklook'?'Drag to orbit · Scroll to zoom':'';document.getElementById('badge').style.display=shot==='quicklook'?'block':'none';document.getElementById('progress').style.width=(t/(ONLY_SHOT?4:16)*1920)+'px';document.getElementById('cursor').style.transform=`translate(${Math.sin(local*Math.PI/2)*80}px,${Math.cos(local*Math.PI/2)*15}px)`;}
window.renderAt=renderAt;
fetch('assets/manifest.json').then(r=>r.json()).then(async data=>{manifest=data;document.getElementById('files').innerHTML=shots.slice(0,3).map((s)=>`<div class="file"><img src="${src(s,0)}"><p>${data[s].name}</p></div>`).join('');for(const s of shots){for(let i=0;i<120;i++){const img=new Image();img.src=src(s,i);cache.set(s+i,img)}}await Promise.all([...cache.values()].map(im=>im.decode()));renderAt(0);gsap.registerPlugin({name:'demoClock',init(){},render:r=>renderAt(r*(ONLY_SHOT?4:16))});const tl=gsap.timeline({paused:true});tl.to({},{demoClock:1,duration:ONLY_SHOT?4:16,ease:'none'});window.__timelines={main:tl};window.demoReady=true;}).catch(e=>{document.getElementById('headline').textContent='Run demo/export.py frames first';console.error(e)});
</script></body></html>
