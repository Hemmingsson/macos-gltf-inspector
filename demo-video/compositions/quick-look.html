<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quick Look · AET_Showcase</title>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: transparent;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          sans-serif;
        color: #1d1d1f;
      }
      main {
        position: relative;
        width: 800px;
        height: 508px;
        overflow: hidden;
      }
      #finder {
        position: absolute;
        left: 18px;
        top: 86px;
        width: 420px;
        height: 360px;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.14),
          0 14px 32px rgba(0, 0, 0, 0.28);
        display: grid;
        grid-template-columns: 148px 1fr;
        grid-template-rows: 38px 1fr;
      }
      #finder-toolbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: #f6f6f7;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        font-size: 12px;
        font-weight: 600;
      }
      #finder-toolbar .traffic {
        display: flex;
        gap: 6px;
        width: 48px;
      }
      #finder-toolbar .traffic i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d0d0d2;
      }
      #finder-side {
        background: #f2f2f3;
        border-right: 1px solid rgba(0, 0, 0, 0.08);
        padding: 8px 6px;
        font-size: 11px;
      }
      #finder-side .group {
        color: #6e6e73;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        padding: 6px 8px 3px;
      }
      #finder-side .row {
        height: 22px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        border-radius: 5px;
        color: #3a3a3c;
      }
      #finder-side .row.active {
        background: #d9d9dc;
      }
      #files {
        padding: 6px;
      }
      .file {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 8px;
        border-radius: 5px;
        font-size: 11.5px;
        color: #3a3a3c;
      }
      .file img {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        object-fit: cover;
        background: #ddd;
      }
      .file.selected {
        background: #007aff;
        color: white;
      }
      #ql {
        position: absolute;
        left: 250px;
        top: 28px;
        width: 520px;
        height: 420px;
        border-radius: 12px;
        overflow: hidden;
        background: #7d7d7d;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.2),
          0 22px 48px rgba(0, 0, 0, 0.4);
        transform-origin: 15% 35%;
      }
      #titlebar {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: #3a3a3c;
        color: #f5f5f7;
      }
      #titlebar .dots {
        display: flex;
        gap: 6px;
        width: 52px;
      }
      #titlebar .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #68686c;
      }
      #titlebar strong {
        flex: 1;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
      }
      #titlebar .open {
        padding: 4px 10px;
        border-radius: 6px;
        background: #555558;
        font-size: 11px;
        white-space: nowrap;
      }
      #clip {
        position: absolute;
        left: 0;
        top: 40px;
        width: 100%;
        height: calc(100% - 40px);
        object-fit: cover;
        object-position: center;
        background: #eceef0;
      }
    </style>
  </head>
  <body>
    <main
      id="quick-look"
      data-composition-id="quick-look"
      data-width="800"
      data-height="508"
      data-start="0"
      data-duration="3"
      data-fps="60"
    >
      <div id="finder" class="clip" data-start="0" data-duration="3">
        <div id="finder-toolbar">
          <span class="traffic"><i></i><i></i><i></i></span>
          3D Models
        </div>
        <aside id="finder-side">
          <div class="group">Favourites</div>
          <div class="row">Recents</div>
          <div class="row">Applications</div>
          <div class="row">Documents</div>
          <div class="row active">Downloads</div>
          <div class="group">iCloud</div>
          <div class="row">iCloud Drive</div>
        </aside>
        <div id="files">
          <div class="file">
            <img src="../finder/cube.webp" alt="" />cube.gltf
          </div>
          <div class="file">
            <img src="../finder/lumen.webp" alt="" />lumenStudio.glb
          </div>
          <div class="file">
            <img src="../finder/boombox.webp" alt="" />boombox.glb
          </div>
          <div class="file selected">
            <img src="../finder/aet.webp" alt="" />AET_Showcase.glb
          </div>
          <div class="file">
            <img src="../finder/aet.webp" alt="" />AET_Gen2.glb
          </div>
          <div class="file">
            <img src="../finder/studio.webp" alt="" />studio_light.glb
          </div>
          <div class="file">
            <img src="../finder/aet.webp" alt="" />Wheel_Single.glb
          </div>
        </div>
      </div>
      <div id="ql" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="titlebar">
          <span class="dots"><i></i><i></i><i></i></span>
          <strong>AET_Showcase.glb</strong>
          <span class="open">Open with glTF Inspector</span>
        </div>
        <video
          id="clip"
          class="clip"
          muted
          playsinline
          preload="auto"
          src="../turntable.mp4"
          data-start="0"
          data-duration="3"
          data-track-index="0"
        ></video>
      </div>
    </main>
    <script>
      const ql = document.querySelector("#ql");
      const clock = { time: 0 };
      const smooth = (value) => {
        const x = Math.max(0, Math.min(1, value));
        return x * x * (3 - 2 * x);
      };
      function draw() {
        const open =
          smooth((clock.time - 0.15) / 0.35) *
          smooth((2.9 - clock.time) / 0.25);
        gsap.set(ql, {
          opacity: open,
          scale: 0.72 + 0.28 * open,
        });
      }
      const timeline = gsap.timeline({ paused: true });
      timeline.to(clock, {
        time: 3,
        duration: 3,
        ease: "none",
        onUpdate: draw,
      });
      window.__timelines = { "quick-look": timeline };
      draw();
    </script>
  </body>
</html>
