<!doctype html>
<!--
  The one page every surface renders through: Finder thumbnail, Quick Look preview and the
  document window. Two modes, one renderer — a second page would let the surfaces drift, which
  is the exact failure the one-renderer rule exists to prevent.

  Swift calls five async functions on `window.__viewer` through `callAsyncJavaScript`:
  open, apply, camera, still, stats — one JSON argument, one JSON result, a throw is an error
  (WebRendererHost.call). Mode and still size come from the URL (`?mode=still&size=512`). The page
  only pushes events on `webkit.messageHandlers.viewer`: ready, warning, contextlost, error, and
  zoom (camera distance vs the last fit, as a whole percent, sent when it changes).

  Nothing here is fetched from the network. All bytes arrive through the Swift scheme handler,
  and paths stay relative — the Khronos renderer rejects absolute URLs for its library and LUT
  paths ("Absolute URLs are not allowed for security reasons").
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<!--
  Must be a classic script and must come before the module: it defines the global
  `createKtxModule` that `createResourceLoader` reads. Without it, construction throws
  "Can't find variable: createKtxModule".
-->
<script src="libs/libktx.js"></script>
<!--
  Same story for Draco: `DracoDecoder` reads a global `DracoDecoderModule`, and the Khronos
  bundle ships no decoder — the sample viewer fetches one from a CDN, which this page cannot do.
  Vendored from google/draco (Apache-2.0); the wrapper locates draco_decoder_gltf.wasm beside
  itself. Missing this throws "Can't find variable: DracoDecoderModule" at module load, which
  breaks every file, not just Draco-compressed ones.
-->
<script src="libs/draco_wasm_wrapper_gltf.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import { GltfView, GltfState } from "./gltf-viewer.module.js";

const send = (payload) => window.webkit.messageHandlers.viewer.postMessage(payload);

// Khronos reports many load problems with console.error instead of throwing. Forward them so
// they reach the app's log as warnings; the console still gets them.
const consoleError = console.error.bind(console);
console.error = (...args) => {
    consoleError(...args);
    send({ event: "warning", message: args.map((a) => String(a?.message ?? a)).join(" ") });
};

const query = new URLSearchParams(location.search);
const live = query.get("mode") === "live";

const canvas = document.getElementById("stage");
// Nothing on the GPU survives this; Swift treats it as a dead page and restarts it.
canvas.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    send({ event: "contextlost" });
});
// `still()` renders and reads back in one task, so only still mode keeps the drawing buffer
// (a thumbnail host may be read again without a new frame); live mode lets WebKit discard it.
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: !live, alpha: true });
if (!gl) {
    send({ event: "error", message: "WebGL 2 unavailable" });
    throw new Error("WebGL 2 unavailable");
}

// GPU wireframe: LINE around mesh primitives. Post-process (tonemap strip, IBL triangle)
// stays FILL. Missing extension → cached CPU lines, rebuilt only on scene/variant change.
const polygonMode = gl.getExtension("WEBGL_polygon_mode");
let wireframePass = false;
let cachedWireLines = null;
let cachedWireKey = null;

function isPostProcessPrimitive(mode, count, isArrays) {
    // Tonemap / blit quads. `TRIANGLES, 3` is also a one-triangle mesh (the skin fixture),
    // so it is only skipped on the arrays path when it is the IBL fullscreen triangle —
    // that pass runs outside `wireframePass` (loadEnvironment), not here.
    return isArrays && mode === gl.TRIANGLE_STRIP && count === 4;
}

function wrapPolygonModeDraw(orig, countAt, isArrays) {
    return function(...args) {
        const mode = args[0];
        const count = args[countAt];
        const line = wireframePass
            && (mode === gl.TRIANGLES || mode === gl.TRIANGLE_STRIP || mode === gl.TRIANGLE_FAN)
            && !isPostProcessPrimitive(mode, count, isArrays);
        if (line) polygonMode.polygonModeWEBGL(gl.FRONT_AND_BACK, polygonMode.LINE_WEBGL);
        try {
            return orig.apply(this, args);
        } finally {
            if (line) polygonMode.polygonModeWEBGL(gl.FRONT_AND_BACK, polygonMode.FILL_WEBGL);
        }
    };
}

if (polygonMode) {
    gl.drawArrays = wrapPolygonModeDraw(gl.drawArrays.bind(gl), 2, true);
    gl.drawElements = wrapPolygonModeDraw(gl.drawElements.bind(gl), 1, false);
    gl.drawArraysInstanced = wrapPolygonModeDraw(gl.drawArraysInstanced.bind(gl), 2, true);
    gl.drawElementsInstanced = wrapPolygonModeDraw(gl.drawElementsInstanced.bind(gl), 1, false);
}

const view = new GltfView(gl);
const state = view.createState();
// Relative libPath, per the absolute-URL restriction noted above.
const resources = view.createResourceLoader(undefined, undefined, "libs/");

state.renderingParameters.toneMap = GltfState.ToneMaps.KHR_PBR_NEUTRAL;
// First paint uses Khronos key+fill. HDR IBL is optional until the look's environment
// lands — `useIBL` stays off so the first frame is a lit silhouette, not a black clear.
state.renderingParameters.useIBL = false;
state.renderingParameters.useDirectionalLightsWithDisabledIBL = true;
state.renderingParameters.clearColor = [0, 0, 0, 0];
state.renderingParameters.renderEnvironmentMap = false;

let autoRotate = false;
/** Inspector chrome drawn after the Khronos frame. Off until the host asks — still/thumbnail
 *  must not inherit the document window's floor or gizmos. */
let showFloor = false;
let centerModel = true;
let showWireframe = false;
let selectedNodeIndex = null;

/** CPU ms of each drawn frame (Khronos frame + overlays) since the last `stats()`, newest last.
 *  Capped so an idle live page does not grow it; read by the opt-in bench. */
const frameTimes = [];
const frameTimeLimit = 600;

function drawFrame() {
    const t0 = performance.now();
    wireframePass = !!(showWireframe && polygonMode);
    view.renderFrame(state, canvas.width, canvas.height);
    wireframePass = false;
    drawOverlays();
    const ms = performance.now() - t0;
    if (frameTimes.length >= frameTimeLimit) frameTimes.shift();
    frameTimes.push(ms);
    return ms;
}

function percentile(sorted, p) {
    if (!sorted.length) return 0;
    return sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))];
}

/** Continuous rendering for the document window and Quick Look. */
function tick() {
    if (!live) return;
    resize();
    // Spin the camera around the target rather than the model, so the authored transform is
    // never misrepresented — an inspector must not move geometry the file did not move.
    if (autoRotate && state.gltf) state.userCamera.orbit(1.2, 0);
    // `renderFrame` clears the drawing buffer even when there is no gltf — skip until load.
    if (state.gltf) drawFrame();
    reportZoom();
    requestAnimationFrame(tick);
}

function resize() {
    // Size from the viewport, not clientWidth: a canvas whose container has not been laid out
    // yet reports 0 and silently renders 1x1, which looks exactly like a broken renderer.
    const cssW = canvas.clientWidth || window.innerWidth;
    const cssH = canvas.clientHeight || window.innerHeight;
    const w = Math.max(1, Math.round(cssW * window.devicePixelRatio));
    const h = Math.max(1, Math.round(cssH * window.devicePixelRatio));
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
    }
}

/**
 * Frames the current scene.
 *
 * The `applyTransformHierarchy` call is load-bearing. `fitViewToScene` measures the scene
 * through `getSceneExtents`, which reads each node's *rendered world transform* — and those are
 * only computed inside `renderFrame`. Fitting straight after a load therefore measures
 * untransformed local geometry: AnimatedMorphCube is a single node scaled 100x, so its extents
 * come back a hundredth of their real size and the camera is placed inside the cube. Models
 * whose geometry is one small mesh instanced by node translations — MetalRoughSpheres,
 * ClearCoatTest — are framed to a single instance and overflow the frame.
 */
function fitCamera() {
    const scene = state.gltf?.scenes?.[state.sceneIndex];
    if (scene === undefined) return;
    scene.applyTransformHierarchy(state.gltf);
    state.userCamera.fitViewToScene(state.gltf, state.sceneIndex);
    if (!centerModel) includeOriginInFraming();
    applySharedFitDistance();
    applyProjection();
}

/**
 * Khronos `fitDistanceToExtents` fills the XY box with no margin. Fit instead uses the
 * projected AABB + near-face depth + 1.02 padding, the same rule as `RenderCamera.fitDistance`.
 */
const FIT_PADDING = 1.02;

function clamp(value, lo, hi) {
    return Math.min(hi, Math.max(lo, value));
}

function sharedFitDistance(extent, toCamera, aspect, fovDeg, padding) {
    const len = Math.hypot(toCamera[0], toCamera[1], toCamera[2]);
    const dir = len > 1e-4
        ? [toCamera[0] / len, toCamera[1] / len, toCamera[2] / len]
        : [0, 0, 1];
    const forward = [-dir[0], -dir[1], -dir[2]];
    let right = [-forward[2], 0, forward[0]];
    const rightLen = Math.hypot(right[0], right[1], right[2]);
    right = rightLen < 1e-4 ? [1, 0, 0] : right.map((v) => v / rightLen);
    const up = [
        right[1] * forward[2] - right[2] * forward[1],
        right[2] * forward[0] - right[0] * forward[2],
        right[0] * forward[1] - right[1] * forward[0],
    ];
    const upLen = Math.hypot(up[0], up[1], up[2]);
    const upN = up.map((v) => v / upLen);
    const half = extent.map((e) => e * 0.5);
    const projectedHalf = (axis) =>
        Math.abs(axis[0]) * half[0] + Math.abs(axis[1]) * half[1] + Math.abs(axis[2]) * half[2];
    const safeAspect = (aspect > 0.05 && aspect < 20) ? aspect : 1;
    const vHalf = clamp(fovDeg, 15, 90) * Math.PI / 360;
    const hHalf = Math.atan(Math.tan(vHalf) * safeAspect);
    const distanceV = projectedHalf(upN) / Math.tan(vHalf);
    const distanceH = projectedHalf(right) / Math.tan(hHalf);
    const distance = Math.max(distanceV, distanceH) + projectedHalf(forward);
    return Math.max(0.0001, distance * padding);
}

/** Distance the last fit chose — 100% on the View menu's zoom readout. */
let fitDistance = null;
let reportedZoom = null;

/** Tells Swift the zoom (fit distance ÷ camera distance) when its whole percent changes. */
function reportZoom() {
    const distance = state.userCamera?.distance;
    if (!state.gltf || !(fitDistance > 0) || !(distance > 0)) return;
    const percent = Math.round(fitDistance / distance * 100);
    if (percent === reportedZoom || !Number.isFinite(percent)) return;
    reportedZoom = percent;
    send({ event: "zoom", message: String(percent) });
}

function applySharedFitDistance() {
    const camera = state.userCamera;
    const min = camera.sceneExtents.min;
    const max = camera.sceneExtents.max;
    if (!min || !max) return;
    const extent = [0, 1, 2].map((i) => max[i] - min[i]);
    const position = camera.getPosition();
    const look = camera.getLookDirection();
    const current = camera.distance;
    const target = [0, 1, 2].map((i) => position[i] + look[i] * current);
    const azimuth = camera.rotAroundY * 180 / Math.PI;
    const elevation = camera.rotAroundX * 180 / Math.PI;
    const az = azimuth * Math.PI / 180;
    const el = elevation * Math.PI / 180;
    const toCamera = [
        Math.sin(az) * Math.cos(el),
        -Math.sin(el),
        Math.cos(az) * Math.cos(el),
    ];
    const aspect = canvas.height > 0 ? canvas.width / canvas.height : 1;
    const fovDeg = camera.perspective.yfov * 180 / Math.PI;
    const distance = sharedFitDistance(extent, toCamera, aspect, fovDeg, FIT_PADDING);
    if (!Number.isFinite(distance)) return;
    camera.setDistanceFromTarget(distance, target);
    camera.baseDistance = distance;
    fitDistance = camera.distance;
}

/**
 * When centering is off, the authored origin must be in frame — a model 40 units off-origin
 * is a real inspector finding. Does not run for the floor toggle.
 */
function includeOriginInFraming() {
    const camera = state.userCamera;
    const min = camera.sceneExtents.min.slice();
    const max = camera.sceneExtents.max.slice();
    for (let i = 0; i < 3; i++) {
        min[i] = Math.min(min[i], 0);
        max[i] = Math.max(max[i], 0);
        camera.sceneExtents.min[i] = min[i];
        camera.sceneExtents.max[i] = max[i];
    }
    camera.fitDistanceToExtents(min, max);
    camera.fitCameraTargetToExtents(min, max);
    camera.fitPanSpeedToScene(min, max);
    camera.fitCameraPlanesToExtents(min, max);
}

let overlayProgram = null;
let overlayBuffer = null;
/** Detached copy of `mainDepthTexture` — WebKit returns the clear value when sampling a depth
 *  texture that is still attached to `mainFramebuffer`. */
let overlayDepthTex = null;
let overlayDepthFbo = null;
let overlayDepthW = 0;
let overlayDepthH = 0;

function copySceneDepthForOverlays() {
    const src = view.renderer?.mainFramebuffer;
    if (!src) return null;
    const w = canvas.width, h = canvas.height;
    if (w < 1 || h < 1) return null;
    if (!overlayDepthTex || overlayDepthW !== w || overlayDepthH !== h) {
        if (overlayDepthTex) gl.deleteTexture(overlayDepthTex);
        if (overlayDepthFbo) gl.deleteFramebuffer(overlayDepthFbo);
        overlayDepthTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, overlayDepthTex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.NONE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, w, h, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
        overlayDepthFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, overlayDepthFbo);
        gl.drawBuffers([gl.NONE]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, overlayDepthTex, 0);
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindTexture(gl.TEXTURE_2D, null);
        if (status !== gl.FRAMEBUFFER_COMPLETE) {
            throw new Error(`overlay depth framebuffer incomplete: 0x${status.toString(16)}`);
        }
        overlayDepthW = w;
        overlayDepthH = h;
    }
    // READ and DRAW differ, so attachment calls must name DRAW_FRAMEBUFFER. A depth-only
    // target stays complete only while DRAW_BUFFER0 is NONE (set at creation).
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, src);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, overlayDepthFbo);
    gl.framebufferTexture2D(gl.DRAW_FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, overlayDepthTex, 0);
    while (gl.getError() !== gl.NO_ERROR) {}
    gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.DEPTH_BUFFER_BIT, gl.NEAREST);
    const blitError = gl.getError();
    // Detach before sampling — WebKit returns the clear depth while the texture stays attached.
    gl.framebufferTexture2D(gl.DRAW_FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, null, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (blitError !== gl.NO_ERROR) throw new Error(`overlay depth blit: 0x${blitError.toString(16)}`);
    return overlayDepthTex;
}

function compileOverlayShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader) || "overlay shader compile failed");
    }
    return shader;
}

function compileOverlayProgram() {
    if (overlayProgram) return overlayProgram;
    // Soft depth against the main pass: tonemap leaves the default FB without scene depth, and
    // the antialiased canvas cannot accept a depth blit from the single-sample mainFramebuffer.
    const vs = compileOverlayShader(gl.VERTEX_SHADER, `#version 300 es
        layout(location=0) in vec3 a_pos; layout(location=1) in vec3 a_color;
        uniform mat4 u_vp; out vec3 v_color;
        void main() { gl_Position = u_vp * vec4(a_pos, 1.0); v_color = a_color; }`);
    const fs = compileOverlayShader(gl.FRAGMENT_SHADER, `#version 300 es
        precision highp float; in vec3 v_color; out vec4 fragColor;
        uniform highp sampler2D u_depth; uniform int u_occlude;
        void main() {
            if (u_occlude != 0) {
                float scene = texelFetch(u_depth, ivec2(gl_FragCoord.xy), 0).r;
                if (gl_FragCoord.z > scene) discard;
            }
            fragColor = vec4(v_color, 1.0);
        }`);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program) || "overlay program link failed");
    }
    overlayProgram = program;
    overlayBuffer = gl.createBuffer();
    return program;
}

function mulMat4(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
            o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1]
                + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
        }
    }
    return o;
}

function transformPoint(m, x, y, z) {
    return [
        m[0] * x + m[4] * y + m[8] * z + m[12],
        m[1] * x + m[5] * y + m[9] * z + m[13],
        m[2] * x + m[6] * y + m[10] * z + m[14],
    ];
}

function pushLine(lines, a, b, color) {
    lines.push(a[0], a[1], a[2], color[0], color[1], color[2]);
    lines.push(b[0], b[1], b[2], color[0], color[1], color[2]);
}

function sceneBounds() {
    const min = state.userCamera.sceneExtents.min;
    const max = state.userCamera.sceneExtents.max;
    return {
        min, max,
        extentX: Math.max(1e-4, max[0] - min[0]),
        extentY: Math.max(1e-4, max[1] - min[1]),
        extentZ: Math.max(1e-4, max[2] - min[2]),
    };
}

function collectPolarFloor(lines) {
    const bounds = sceneBounds();
    const diameter = 2.7 * Math.max(bounds.extentX, bounds.extentZ);
    const radius = Math.max(diameter * 0.5, 0.001);
    const y = bounds.min[1] - 0.001;
    const color = [0.53, 0.53, 0.53];
    const rings = 4;
    const radials = 8;
    const segments = 64;
    for (let ring = 1; ring <= rings; ring++) {
        const r = radius * ring / rings;
        let prev = null;
        for (let i = 0; i <= segments; i++) {
            const a = (i / segments) * Math.PI * 2;
            const p = [Math.cos(a) * r, y, Math.sin(a) * r];
            if (prev) pushLine(lines, prev, p, color);
            prev = p;
        }
    }
    const inner = Math.max(radius * 0.03, 0.002);
    for (let i = 0; i < radials; i++) {
        const a = (i / radials) * Math.PI * 2;
        const c = Math.cos(a);
        const s = Math.sin(a);
        pushLine(lines, [c * inner, y, s * inner], [c * radius, y, s * radius], color);
    }
}

function collectOriginGizmo(lines) {
    const bounds = sceneBounds();
    const size = 0.18 * Math.max(bounds.extentX, bounds.extentY, bounds.extentZ, 0.05);
    pushLine(lines, [0, 0, 0], [size, 0, 0], [1, 0.2, 0.2]);
    pushLine(lines, [0, 0, 0], [0, size, 0], [0.2, 1, 0.2]);
    pushLine(lines, [0, 0, 0], [0, 0, size], [0.25, 0.45, 1]);
}

function nodeWorldMatrix(node) {
    return node.getRenderedWorldTransform?.() ?? node.worldTransform;
}

function expandAABB(min, max, point) {
    for (let i = 0; i < 3; i++) {
        min[i] = Math.min(min[i], point[i]);
        max[i] = Math.max(max[i], point[i]);
    }
}

function primitiveAABB(gltf, primitive, world, min, max) {
    const accessorIndex = primitive.attributes?.POSITION;
    if (accessorIndex === undefined) return;
    const accessor = gltf.accessors[accessorIndex];
    if (!accessor?.min || !accessor?.max) return;
    const corners = [];
    for (const x of [accessor.min[0], accessor.max[0]]) {
        for (const y of [accessor.min[1], accessor.max[1]]) {
            for (const z of [accessor.min[2], accessor.max[2]]) {
                corners.push(transformPoint(world, x, y, z));
            }
        }
    }
    for (const p of corners) expandAABB(min, max, p);
}

function subtreeAABB(rootIndex) {
    const gltf = state.gltf;
    if (!gltf) return null;
    const min = [Infinity, Infinity, Infinity];
    const max = [-Infinity, -Infinity, -Infinity];
    const stack = [rootIndex];
    while (stack.length) {
        const index = stack.pop();
        const node = gltf.nodes?.[index];
        if (!node) continue;
        if (node.children) stack.push(...node.children);
        if (node.mesh === undefined) continue;
        const mesh = gltf.meshes[node.mesh];
        const world = nodeWorldMatrix(node);
        if (!mesh?.primitives || !world) continue;
        for (const primitive of mesh.primitives) {
            primitiveAABB(gltf, primitive, world, min, max);
        }
    }
    if (!Number.isFinite(min[0])) {
        const node = gltf.nodes[rootIndex];
        const world = node && nodeWorldMatrix(node);
        if (!world) return null;
        const origin = transformPoint(world, 0, 0, 0);
        return { min: origin, max: origin };
    }
    return { min, max };
}

function collectAABB(lines, box, color) {
    const [x0, y0, z0] = box.min;
    const [x1, y1, z1] = box.max;
    const pad = 0.01 * Math.max(x1 - x0, y1 - y0, z1 - z0, 0.01);
    const a = [x0 - pad, y0 - pad, z0 - pad];
    const b = [x1 + pad, y1 + pad, z1 + pad];
    const corners = [
        [a[0], a[1], a[2]], [b[0], a[1], a[2]], [a[0], b[1], a[2]], [b[0], b[1], a[2]],
        [a[0], a[1], b[2]], [b[0], a[1], b[2]], [a[0], b[1], b[2]], [b[0], b[1], b[2]],
    ];
    const edges = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
    for (const [i, j] of edges) pushLine(lines, corners[i], corners[j], color);
}

let collectWireframeCalls = 0;

function collectWireframe(lines) {
    collectWireframeCalls += 1;
    const gltf = state.gltf;
    const scene = gltf?.scenes?.[state.sceneIndex];
    if (!scene) return;
    const color = [0.85, 0.9, 1];
    const stack = scene.nodes.slice();
    while (stack.length) {
        const node = gltf.nodes[stack.pop()];
        if (!node) continue;
        if (node.children) stack.push(...node.children);
        if (node.mesh === undefined) continue;
        const mesh = gltf.meshes[node.mesh];
        const world = nodeWorldMatrix(node);
        if (!mesh?.primitives || !world) continue;
        for (const primitive of mesh.primitives) {
            const accessor = gltf.accessors[primitive.attributes?.POSITION];
            if (!accessor) continue;
            const positions = accessor.getNormalizedDeinterlacedView?.(gltf);
            if (!positions) continue;
            let indices;
            if (primitive.indices !== undefined) {
                const ia = gltf.accessors[primitive.indices];
                indices = ia.getNormalizedDeinterlacedView?.(gltf) ?? ia.getTypedView?.(gltf);
            }
            const count = indices ? indices.length : positions.length / 3;
            const vertex = (i) => {
                const idx = indices ? indices[i] : i;
                return transformPoint(world, positions[idx * 3], positions[idx * 3 + 1], positions[idx * 3 + 2]);
            };
            for (let i = 0; i + 2 < count; i += 3) {
                const p0 = vertex(i);
                const p1 = vertex(i + 1);
                const p2 = vertex(i + 2);
                pushLine(lines, p0, p1, color);
                pushLine(lines, p1, p2, color);
                pushLine(lines, p2, p0, color);
            }
        }
    }
}

function drawOverlays() {
    if (!state.gltf) return;
    const gpuWire = showWireframe && polygonMode;
    if (!showFloor && centerModel && (!showWireframe || gpuWire) && selectedNodeIndex == null) return;
    const program = compileOverlayProgram();
    const lines = [];
    if (showFloor) collectPolarFloor(lines);
    if (!centerModel) collectOriginGizmo(lines);
    if (showWireframe && !polygonMode) {
        const key = `${state.sceneIndex}|${state.variant ?? ""}`;
        if (cachedWireKey !== key || cachedWireLines == null) {
            const built = [];
            collectWireframe(built);
            cachedWireLines = built;
            cachedWireKey = key;
        }
        for (let i = 0; i < cachedWireLines.length; i++) lines.push(cachedWireLines[i]);
    }
    if (selectedNodeIndex != null) {
        const box = subtreeAABB(selectedNodeIndex);
        if (box) collectAABB(lines, box, [0.15, 0.75, 1]);
    }
    if (!lines.length) return;

    const aspect = canvas.width / Math.max(1, canvas.height);
    const cameraView = state.userCamera.getViewMatrix(state.gltf);
    const proj = state.userCamera.getProjectionMatrix(aspect);
    const vp = mulMat4(proj, cameraView);

    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, overlayBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(lines), gl.STREAM_DRAW);
    const pos = gl.getAttribLocation(program, "a_pos");
    const col = gl.getAttribLocation(program, "a_color");
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(col);
    gl.vertexAttribPointer(col, 3, gl.FLOAT, false, 24, 12);
    gl.uniformMatrix4fv(gl.getUniformLocation(program, "u_vp"), false, vp);
    // Soft-test against a detached copy of the main depth. Skip when a file camera drew the
    // model — overlays still use the user camera, so the depths would not match. The sampler
    // is statically used, so the copy stays bound even when the test is off.
    const depthTex = copySceneDepthForOverlays();
    const occlude = state.cameraNodeIndex == null && depthTex;
    gl.activeTexture(gl.TEXTURE0);
    const previousTexture = gl.getParameter(gl.TEXTURE_BINDING_2D);
    if (depthTex) gl.bindTexture(gl.TEXTURE_2D, depthTex);
    gl.uniform1i(gl.getUniformLocation(program, "u_depth"), 0);
    gl.uniform1i(gl.getUniformLocation(program, "u_occlude"), occlude ? 1 : 0);
    // Tonemap re-enables the hardware test on a depth buffer that does not hold the scene.
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.drawArrays(gl.LINES, 0, lines.length / 6);
    gl.bindTexture(gl.TEXTURE_2D, previousTexture);
}

/**
 * Orbit, dolly and pan are handled here rather than round-tripping every mouse delta through
 * Swift — input has to feel immediate, and a bridge hop per event would not.
 *
 * Scroll is an *infinite* dolly rather than a clamped zoom, and shift-drag pans.
 */
function installPointerControls() {
    let dragging = false;
    let panning = false;
    let lastX = 0;
    let lastY = 0;

    canvas.addEventListener("pointerdown", (e) => {
        if (!live || !state.gltf) return;
        dragging = true;
        panning = e.shiftKey || e.button === 1;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        if (panning) {
            state.userCamera.pan(-dx, dy);
        } else {
            state.userCamera.orbit(dx, dy);
        }
    });

    const endDrag = (e) => {
        dragging = false;
        panning = false;
        if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    };
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    canvas.addEventListener("wheel", (e) => {
        if (!live || !state.gltf) return;
        e.preventDefault();
        state.userCamera.zoomBy(e.deltaY * 0.01);
    }, { passive: false });
}

/** Last look `apply` received (`PageLook` in Swift). */
let look = {};

/**
 * `[r, g, b, a]` in 0-1, painted as the page background — not `clearColor`, which stays
 * transparent so the host window shows around the model when alpha is 0.
 */
function setBackdrop([r, g, b, a] = [0, 0, 0, 0]) {
    document.body.style.background =
        `rgba(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)}, ${a})`;
}

/**
 * Perspective / orthographic. The ortho magnification is derived from the camera distance, so it
 * is restated after every fit or camera move — otherwise switching would rescale the model.
 */
function applyProjection() {
    const camera = state.userCamera;
    if (look.orthographic) {
        camera.type = "orthographic";
        const mag = camera.distance * Math.tan(camera.perspective.yfov / 2);
        camera.orthographic = { xmag: mag, ymag: mag, znear: camera.perspective.znear, zfar: camera.perspective.zfar };
    } else {
        camera.type = "perspective";
    }
}

let environmentURL = null;
let environmentLoad = null;

/** Loads the look's HDR once per change; concurrent callers share the one load. */
function loadEnvironment() {
    const url = look.environment;
    if (!url || (url === environmentURL && environmentLoad)) return environmentLoad ?? Promise.resolve();
    environmentURL = url;
    environmentLoad = (async () => {
        const hdr = await (await fetch(url)).arrayBuffer();
        state.environment = await resources.loadEnvironment(hdr, {
            lut_ggx_file: "assets/lut_ggx.png",
            lut_charlie_file: "assets/lut_charlie.png",
            lut_sheen_E_file: "assets/lut_sheen_E.png",
        });
        state.renderingParameters.useIBL = true;
    })();
    // A failed load is retried by the next caller rather than cached.
    environmentLoad.catch(() => { environmentURL = null; environmentLoad = null; });
    return environmentLoad;
}

/** Camera orbit angles and bounds, as Swift's `RendererCameraState`. Non-finite values are 0. */
function cameraState() {
    const camera = state.userCamera;
    const finite = (x) => (Number.isFinite(x) ? x : 0);
    const position = camera.getPosition();
    const look = camera.getLookDirection();
    const distance = camera.distance;
    return {
        pose: {
            azimuth: camera.rotAroundY * 180 / Math.PI,
            elevation: camera.rotAroundX * 180 / Math.PI,
            distance,
            // Recomputed rather than `UserCamera.getTarget()`, which skips the distance multiply
            // when `distance` is exactly 1 and hands back a point one unit from the camera.
            target: [0, 1, 2].map((i) => position[i] + look[i] * distance),
            yfov: camera.perspective.yfov,
            znear: camera.perspective.znear,
            // A camera that has never been fitted carries the class default of Infinity.
            zfar: finite(camera.perspective.zfar),
        },
        sceneMin: Array.from(camera.sceneExtents.min, finite),
        sceneMax: Array.from(camera.sceneExtents.max, finite),
    };
}

/**
 * Absolute orbit angles in degrees (`UserCamera` works in radians despite its docstring).
 *
 * `setRotation` only re-aims the camera; it does not move it. The target is captured *before*
 * rotating and the camera pushed back out to distance afterwards, as `fitCameraTargetToExtents`
 * does internally. `rotAroundY` / `rotAroundX` are updated so a later fit or drag continues
 * from here rather than snapping back.
 */
function orbitTo(azimuth, elevation, distance, target) {
    const camera = state.userCamera;
    camera.rotAroundY = azimuth * Math.PI / 180;
    camera.rotAroundX = elevation * Math.PI / 180;
    camera.setRotation(camera.rotAroundY, camera.rotAroundX);
    camera.setDistanceFromTarget(distance, target);
}

window.__viewer = {
    /**
     * Loads `url` and frames it. A string URL, not bytes: `.gltf` sidecars resolve relative to
     * it (`gltf-inspector:///model/<name>` → `/model/<bin>`), which Swift serves from the
     * security-scoped folder. Live mode draws the first frame before returning.
     */
    async open({ url }) {
        const t0 = performance.now();
        cachedWireLines = null;
        cachedWireKey = null;
        state.gltf = await resources.loadGltf(url);
        const parseMs = Math.round(performance.now() - t0);
        // A look scene of 0 keeps the file's default scene.
        state.sceneIndex = look.sceneIndex || (state.gltf.scene ?? 0);
        fitCamera();
        const stats = view.gatherStatistics(state) ?? {};
        let firstFrameMs = 0;
        if (live) {
            resize();
            // Layout can change the aspect after the pre-resize fit; restate the shared rule.
            applySharedFitDistance();
            applyProjection();
            // `loadGltf` is CPU. The long blank after it is this first GPU frame (program link +
            // texture upload); doing it here keeps Swift's spinner up until it is done.
            firstFrameMs = Math.round(drawFrame());
        }
        // IBL after the model: the first frame is key+fill; the probe lands a frame or two later.
        loadEnvironment().catch((error) => console.error("environment", error));
        return {
            width: canvas.width,
            height: canvas.height,
            triangles: stats.faceCount ?? 0,
            meshes: stats.meshCount ?? 0,
            parseMs,
            firstFrameMs,
        };
    },

    /**
     * The whole look, every time (`PageLook` in Swift). Cheap values are simply assigned; only a
     * changed environment (IBL prefilter), centring, scene or projection does real work.
     */
    async apply(next) {
        const params = state.renderingParameters;
        params.toneMap = next.toneMap;
        params.exposure = Math.pow(2, next.exposure);   // EV in, linear factor out
        params.environmentRotation = next.environmentRotation;
        params.iblIntensity = next.iblIntensity;
        params.debugOutput = next.debugOutput;
        setBackdrop(next.background);
        autoRotate = next.autoRotate;
        showFloor = next.floor;
        showWireframe = next.wireframe;
        selectedNodeIndex = Number.isInteger(next.selectedNode) ? next.selectedNode : null;
        state.cameraNodeIndex = next.cameraNodeIndex ?? undefined;
        state.variant = next.variant ?? undefined;
        if (look.yfov !== next.yfov) state.userCamera.perspective.yfov = next.yfov * Math.PI / 180;

        const sceneChanged = look.sceneIndex !== next.sceneIndex;
        const refit = look.centered !== next.centered || sceneChanged;
        const projectionChanged = look.orthographic !== next.orthographic;
        centerModel = next.centered !== false;
        look = next;
        if (refit && state.gltf) {
            if (sceneChanged) state.sceneIndex = next.sceneIndex;
            fitCamera();
        } else if (projectionChanged) {
            applyProjection();
        }
        // Before the first model this only records the HDR: first paint does not wait on IBL.
        if (state.gltf) await loadEnvironment();
    },

    /**
     * `fit` (front view), `orbit` (absolute angles, optional distance), `pose` (the whole camera,
     * nothing inherited from the fit heuristic — how goldens replay) or `get`. Always answers
     * with the resulting camera state.
     */
    camera({ op, azimuth, elevation, distance, pose }) {
        const camera = state.userCamera;
        if (op === "fit") {
            fitCamera();
            // `fit` resets the transform but not the orbit angles; restate the front view so the
            // next drag continues from it.
            orbitTo(0, 0, camera.distance, camera.getTarget());
            fitDistance = camera.distance;
        } else if (op === "orbit") {
            orbitTo(azimuth, elevation, distance ?? camera.distance, camera.getTarget());
        } else if (op === "pose") {
            camera.perspective.yfov = pose.yfov;
            camera.perspective.znear = pose.znear;
            camera.perspective.zfar = pose.zfar;
            orbitTo(pose.azimuth, pose.elevation, pose.distance, pose.target);
            // Pan and zoom scale off baseDistance; a stale one would make later interaction
            // depend on how the camera was set.
            camera.baseDistance = pose.distance;
        } else if (op !== "get") {
            throw new Error(`unknown camera op '${op}'`);
        }
        if (op !== "get") applyProjection();
        return cameraState();
    },

    /**
     * One frame as a PNG data URL. Still mode keeps its exact pixel size (never multiplied by
     * `devicePixelRatio`); `size` changes it. Waits for a pending IBL so a thumbnail is lit.
     */
    async still({ size } = {}) {
        if (!live && size && (canvas.width !== size || canvas.height !== size)) {
            canvas.width = canvas.height = size;
        }
        await loadEnvironment();
        drawFrame();
        return { png: canvas.toDataURL("image/png") };
    },

    /** Test-only bake: read one pinned IBL subresource without any filtering or colour conversion.
     * The native renderer consumes baked bytes, never this bridge at runtime.
     */
    async exportEnvironment({ name, mip = 0, face = 0, metadata = false } = {}) {
        await loadEnvironment();
        const env = state.environment;
        const definitions = {
            diffuse: ["diffuseEnvMap", 256, true, 1],
            specular: ["specularEnvMap", 256, true, env.mipCount + 1],
            sheen: ["sheenEnvMap", 256, true, env.mipCount + 1],
            ggxLUT: ["lut", 1024, false, 1],
            charlieLUT: ["sheenLUT", 1024, false, 1],
            sheenELUT: ["sheenELUT", 0, false, 1],
        };
        if (metadata) return { intensityScale: env.iblIntensityScale, mipCount: env.mipCount,
            textures: Object.entries(definitions).map(([name, [key, size, cube, mipLevels]]) => {
                const image = env.images[env.textures[env[key].index].source].image;
                return { name, size: size || image.width, cube, mipLevels };
            }) };
        const definition = definitions[name];
        if (!definition) throw new Error(`Unknown bake texture ${name}`);
        const [key, size, cube, mipLevels] = definition;
        if (mip < 0 || mip >= mipLevels || face < 0 || face >= (cube ? 6 : 1)) {
            throw new Error("Invalid IBL subresource");
        }
        const info = env[key];
        // This performs the normal upstream upload for the PNG sheen-energy LUT too.
        view.renderer.webGl.setTexture(undefined, env, info, 0);
        const texture = env.textures[info.index].glTexture;
        const image = env.images[env.textures[info.index].source].image;
        const width = Math.max(1, (size || image.width) >> mip);
        const height = Math.max(1, (size || image.height) >> mip);
        const oldRead = gl.getParameter(gl.READ_FRAMEBUFFER_BINDING);
        const oldDraw = gl.getParameter(gl.DRAW_FRAMEBUFFER_BINDING);
        const framebuffer = gl.createFramebuffer();
        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                cube ? gl.TEXTURE_CUBE_MAP_POSITIVE_X + face : gl.TEXTURE_2D, texture, mip);
            if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
                throw new Error(`IBL framebuffer incomplete: ${name}/${mip}/${face}`);
            }
            while (gl.getError() !== gl.NO_ERROR) { /* discard upstream's prior error state */ }
            const floats = new Float32Array(width * height * 4);
            if (name === "sheenELUT") {
                const bytes = new Uint8Array(floats.length);
                gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
                for (let i = 0; i < bytes.length; ++i) floats[i] = bytes[i] / 255;
            } else {
                gl.readPixels(0, 0, width, height, gl.RGBA, gl.FLOAT, floats);
            }
            const error = gl.getError();
            if (error !== gl.NO_ERROR) throw new Error(`IBL readPixels error ${error}: ${name}`);
            const bytes = new Uint8Array(floats.buffer);
            let binary = "";
            for (let offset = 0; offset < bytes.length; offset += 32768) {
                binary += String.fromCharCode(...bytes.subarray(offset, offset + 32768));
            }
            return { width, height, data: btoa(binary) };
        } finally {
            gl.bindFramebuffer(gl.READ_FRAMEBUFFER, oldRead);
            gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, oldDraw);
            gl.deleteFramebuffer(framebuffer);
        }
    },

    /** Also drains the frame-time buffer: `frames` covers the frames drawn since the last call. */
    stats() {
        const stats = state.gltf ? view.gatherStatistics(state) ?? {} : {};
        const frames = frameTimes.splice(0).sort((a, b) => a - b);
        return {
            frameCount: frames.length,
            frameP50Ms: percentile(frames, 0.5),
            frameP95Ms: percentile(frames, 0.95),
            width: canvas.width,
            height: canvas.height,
            triangles: stats.faceCount ?? 0,
            meshes: stats.meshCount ?? 0,
            background: getComputedStyle(document.body).backgroundColor,
            wireframePath: showWireframe
                ? (polygonMode ? "polygonMode" : "cachedLines")
                : "none",
            wireframeCollects: collectWireframeCalls,
        };
    },

    /**
     * Test helper: set a node's quaternion and restates the hierarchy so a later frame
     * sees the new joint matrices. Used to prove wireframe follows skinning.
     */
    poseNode({ index, rotation }) {
        const node = state.gltf?.nodes?.[index];
        if (!node) throw new Error(`no node ${index}`);
        const prop = node.animatedPropertyObjects?.rotation;
        if (prop) {
            prop.animatedValue = undefined;
            prop.restAt(rotation);
        } else {
            node.rotation = rotation;
        }
        state.gltf.scenes[state.sceneIndex]?.applyTransformHierarchy(state.gltf);
        return { ok: true };
    },
};

if (live) {
    installPointerControls();
    requestAnimationFrame(tick);
} else {
    canvas.style.width = canvas.style.height = "auto";
    canvas.width = canvas.height = Number(query.get("size")) || 512;
}

// Anything that escapes a call still has to produce a message, or Swift only sees a timeout.
window.addEventListener("error", (e) =>
    send({ event: "error", message: String(e.error?.message ?? e.message) }));
window.addEventListener("unhandledrejection", (e) =>
    send({ event: "error", message: String(e.reason?.message ?? e.reason) }));

send({ event: "ready" });
</script>
</body>
</html>
