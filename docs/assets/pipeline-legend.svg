<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 352" width="220" height="352" role="img" aria-labelledby="legend-title">
  <title id="legend-title">Pipeline chart legend</title>
  <rect width="220" height="352" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    .heading { font-size: 10px; font-weight: 600; fill: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
  </style>

  <text class="heading" x="12" y="20">Nodes</text>

  <g transform="translate(12, 28)">
    <rect width="68" height="18" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="78" y="13">Prepare</text>
  </g>
  <g transform="translate(12, 52)">
    <rect width="68" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="78" y="13">Parse</text>
  </g>
  <g transform="translate(12, 76)">
    <rect width="68" height="18" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
    <text x="78" y="13">Convert</text>
  </g>
  <g transform="translate(12, 100)">
    <rect width="68" height="18" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/>
    <text x="78" y="13">Materials</text>
  </g>
  <g transform="translate(12, 124)">
    <rect width="68" height="18" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
    <text x="78" y="13">Lights / cameras</text>
  </g>
  <g transform="translate(12, 148)">
    <polygon points="9,0 18,9 9,18 0,9" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="78" y="13">Decision</text>
  </g>
  <g transform="translate(12, 172)">
    <ellipse cx="9" cy="9" rx="8" ry="6" fill="#ecfccb" stroke="#65a30d" stroke-width="1.2"/>
    <text x="78" y="13">Report</text>
  </g>
  <g transform="translate(12, 196)">
    <rect width="68" height="18" rx="4" fill="#ffedd5" stroke="#f97316" stroke-width="1.2"/>
    <text x="78" y="13">Warn</text>
  </g>
  <g transform="translate(12, 220)">
    <rect width="68" height="18" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
    <text x="78" y="13">Error</text>
  </g>
  <g transform="translate(12, 244)">
    <rect width="68" height="18" rx="4" fill="#bbf7d0" stroke="#15803d" stroke-width="1.2"/>
    <text x="78" y="13">Success</text>
  </g>

  <text class="heading" x="12" y="278">Edges</text>

  <g transform="translate(12, 286)">
    <line x1="0" y1="8" x2="32" y2="8" stroke="#16a34a" stroke-width="2" stroke-opacity="0.8"/>
    <text x="40" y="12">yes / ok</text>
  </g>
  <g transform="translate(12, 308)">
    <line x1="0" y1="8" x2="32" y2="8" stroke="#dc2626" stroke-width="2" stroke-opacity="0.8"/>
    <text x="40" y="12">no / fail</text>
  </g>
  <g transform="translate(12, 330)">
    <line x1="0" y1="8" x2="32" y2="8" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="40" y="12">reports / async</text>
  </g>
</svg>
