<!doctype html>
<!--
  Throwaway still harness for animated Khronos goldens. Not shipped in the app.
  The pinned page (f1fd1af viewer, bundle from the last vendored tree) never set
  animationIndices. This page does: one clip, setFixedTime(t) with t > 0
  (fixedTime || now treats 0 as unset), then one still.
-->
<html>
<head>
<meta charset="utf-8">
<title>Khronos animated still</title>
<script src="libs/libktx.js"></script>
<script src="libs/draco_wasm_wrapper_gltf.js"></script>
<script>
window.__report = (payload) => fetch("/result", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
});
window.addEventListener("error", (event) => {
    window.__report({ ok: false, message: String(event.error?.message ?? event.message) });
});
window.addEventListener("unhandledrejection", (event) => {
    window.__report({ ok: false, message: String(event.reason?.message ?? event.reason) });
});
</script>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import { GltfView, GltfState } from "./gltf-viewer.module.js";

const canvas = document.getElementById("stage");
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, alpha: true });
if (!gl) throw new Error("WebGL 2 unavailable");

const view = new GltfView(gl);
const state = view.createState();
const resources = view.createResourceLoader(undefined, undefined, "libs/");

const params = state.renderingParameters;
params.toneMap = GltfState.ToneMaps.KHR_PBR_NEUTRAL;
params.clearColor = [0, 0, 0, 0];
params.renderEnvironmentMap = false;
params.useIBL = false;

function orbitTo(azimuth, elevation, distance, target) {
    const camera = state.userCamera;
    camera.rotAroundY = azimuth * Math.PI / 180;
    camera.rotAroundX = elevation * Math.PI / 180;
    camera.setRotation(camera.rotAroundY, camera.rotAroundX);
    camera.setDistanceFromTarget(distance, target);
}

function currentTarget(camera) {
    const position = camera.getPosition();
    const look = camera.getLookDirection();
    const distance = camera.distance;
    return [0, 1, 2].map((component) => position[component] + look[component] * distance);
}

function cameraState() {
    const camera = state.userCamera;
    return {
        azimuth: camera.rotAroundY * 180 / Math.PI,
        elevation: camera.rotAroundX * 180 / Math.PI,
        distance: camera.distance,
        target: currentTarget(camera),
        yfov: camera.perspective.yfov,
        znear: camera.perspective.znear,
        zfar: camera.perspective.zfar,
    };
}

function applyPose(pose) {
    const camera = state.userCamera;
    camera.perspective.yfov = pose.yfov;
    camera.perspective.znear = pose.znear;
    camera.perspective.zfar = pose.zfar;
    camera.perspective.aspectRatio = 1;
    orbitTo(pose.azimuth, pose.elevation, pose.distance, pose.target);
    camera.baseDistance = pose.distance;
}

function opaqueCount() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const pixelCount = canvas.width * canvas.height;
    const pixels = new Uint8Array(pixelCount * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let opaque = 0;
    for (let offset = 3; offset < pixels.length; offset += 4) {
        if (pixels[offset] > 10) opaque += 1;
    }
    return opaque;
}

function draw() {
    view.renderFrame(state, canvas.width, canvas.height);
    view.renderFrame(state, canvas.width, canvas.height);
    return { png: canvas.toDataURL("image/png"), opaque: opaqueCount() };
}

const name = new URLSearchParams(location.search).get("name");
const job = await (await fetch(`/job?name=${encodeURIComponent(name)}`)).json();

canvas.width = canvas.height = job.size;
params.toneMap = job.look.toneMapping;
params.exposure = 2 ** job.look.exposureEV;
params.environmentRotation = job.look.environmentRotationDegrees;
params.iblIntensity = 1;

const hdr = await (await fetch(job.environmentURL)).arrayBuffer();
state.environment = await resources.loadEnvironment(hdr, {
    lut_ggx_file: "assets/lut_ggx.png",
    lut_charlie_file: "assets/lut_charlie.png",
    lut_sheen_E_file: "assets/lut_sheen_E.png",
});
params.useIBL = true;

state.gltf = await resources.loadGltf(job.modelURL);
state.sceneIndex = state.gltf.scene ?? 0;

if (job.camera) {
    applyPose(job.camera);
} else {
    state.userCamera.fitViewToScene(state.gltf, state.sceneIndex);
    const camera = state.userCamera;
    orbitTo(job.orbit.azimuth, job.orbit.elevation, camera.distance, currentTarget(camera));
    camera.baseDistance = camera.distance;
}

state.animationIndices = [];
const rest = draw();

if (!(job.animation.time > 0)) {
    throw new Error("animation time must be > 0 (AnimationTimer treats fixedTime 0 as unset)");
}
state.animationIndices = [job.animation.index];
state.animationTimer.setFixedTime(job.animation.time);
const posed = draw();

await window.__report({
    ok: true,
    name,
    png: posed.png,
    restPng: rest.png,
    opaque: posed.opaque,
    restOpaque: rest.opaque,
    camera: cameraState(),
    renderer: String(gl.getParameter(gl.RENDERER)),
});
</script>
</body>
</html>
